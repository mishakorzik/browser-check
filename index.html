async function workerRoundTrip(){
    return new Promise(res=>{
        try{
            const code=`self.onmessage=e=>{self.postMessage({pong:e.data.ping,ts:Date.now()});};`;
            const blob=new Blob([code],{type:"application/javascript"});
            const url=URL.createObjectURL(blob);
            const w=new Worker(url);
            const t0=performance.now();
            w.onmessage=e=>{
                const rtt=(performance.now()-t0).toFixed(2);
                w.terminate();URL.revokeObjectURL(url);
                res("OK, RTT "+rtt+" ms");
            };
            w.onerror=()=>res("Error");
            w.postMessage({ping:Date.now()});
            setTimeout(()=>res("Timeout"),3000);
        }catch(e){res("Unavailable: "+e.message);}
    });
}

    const detectedFonts=fontList.filter(f=>{fCtx.font="72px '"+f+"',monospace";return fCtx.measureText("mmmmmmmmmmlli").width!==baseW;});
    row("Detected Fonts",detectedFonts.join(", ")||"None","");
    row("Font Count",detectedFonts.length,"");
    if(navigator.plugins&&navigator.plugins.length){
        row("Plugins Count",navigator.plugins.length,"");
        for(const p of navigator.plugins) subrow(p.name,(p.description||p.filename||"-").slice(0,80),"");
    }else row("Plugins","None detected");
    const devCountId=probeRow("Media Devices Count");
    navigator.mediaDevices.enumerateDevices().then(devices=>{
        resolve(devCountId,devices.length,"");
        devices.forEach((d,i)=>subrow("Device "+(i+1),d.kind+" - "+(d.label||"Hidden"),""));
    }).catch(()=>resolve(devCountId,"Unavailable","f"));
    section("Network");
    const ni=networkInfo();
    row("Connection API",ni.hasConnectionAPI);
    if(ni.hasConnectionAPI){
        row("Effective Type",ni.effectiveType);
        row("Connection Kind",ni.type);
        row("Downlink",ni.downlink);
        row("Downlink Max",ni.downlinkMax);
        row("RTT",ni.rtt);
        row("Save Data",ni.saveData);
    }
    row("Referrer",document.referrer||"None");
    row("Protocol",location.protocol);
    row("History Length",history.length);
    section("DNS & IP Leak (WebRTC)");
    row("WebRTC Available",typeof RTCPeerConnection!=="undefined");
    const rtcSlots=[];
    const leakId=probeRow("DNS Leak Risk");
    if(typeof RTCPeerConnection!=="undefined"){
        for(let i=0;i<6;i++) rtcSlots.push(probeRow("IP Candidate "+(i+1)));
        getWebRTCIPs().then(ips=>{
            if(ips.length){
                ips.forEach((ip,i)=>{
                    if(i>=rtcSlots.length) return;
                    const isLocal=/^(10\.|172\.(1[6-9]|2\d|3[01])\.|192\.168\.|::1$|127\.|fc|fd|fe80)/i.test(ip);
                    const type=isLocal?"Local/Private":ip.includes(":")?"IPv6 Public":"IPv4 Public";
                    resolve(rtcSlots[i],ip+" ["+type+"]",isLocal?"w":"f");
                });
                for(let i=ips.length;i<rtcSlots.length;i++) resolve(rtcSlots[i],"-","d");
                const hasPublicV4=ips.some(ip=>!ip.includes(":")&&!/^(10\.|172\.(1[6-9]|2\d|3[01])\.|192\.168\.|127\.)/i.test(ip)&&ip!=="0.0.0.0");
                resolve(leakId,hasPublicV4?"HIGH - Public IPv4 exposed":"Low (local only)",hasPublicV4?"f":"w");
            }else{
                rtcSlots.forEach(id=>resolve(id,"None gathered","w"));
                resolve(leakId,"WebRTC possibly blocked","w");
            }
        });
    }else{
        rtcSlots.forEach(id=>resolve(id,"N/A",""));
        resolve(leakId,"WebRTC unavailable","f");
    }
    section("Storage");
    row("LocalStorage Available",!!window.localStorage);
    row("LocalStorage Functional",testLocalStorage());
    row("SessionStorage Available",!!window.sessionStorage);
    row("SessionStorage Functional",testSessionStorage());
    row("Cookie Functional",testCookies());
    row("IndexedDB Available",!!window.indexedDB);
    const idbId=probeRow("IndexedDB Functional");
    testIndexedDB().then(v=>resolve(idbId,v));
    row("CacheStorage Available",!!window.caches);
    const cacheId=probeRow("CacheStorage Functional");
    testCacheStorage().then(v=>resolve(cacheId,v));
    row("Service Worker","serviceWorker" in navigator);
    const quotaId=probeRow("Storage Quota");
    const usedId=probeRow("Storage Used");
    const privateId=probeRow("Private Mode (quota hint)");
    if(navigator.storage) navigator.storage.estimate().then(est=>{
        resolve(quotaId,Math.round(est.quota/1073741824*100)/100+" GB","");
        resolve(usedId,Math.round(est.usage/1048576)+" MB","");
        resolve(privateId,est.quota<120000000?"likely":"unlikely");
    }).catch(()=>{[quotaId,usedId,privateId].forEach(id=>resolve(id,"Unavailable","f"));});
    row("Storage Persistence API",!!navigator.storage?.persist);
    section("Battery");
    const batLvlId=probeRow("Battery Level");
    const batChgId=probeRow("Charging");
    const batChgTId=probeRow("Charging Time");
    const batDisId=probeRow("Discharging Time");
    if(navigator.getBattery){
        navigator.getBattery().then(bat=>{
            resolve(batLvlId,Math.floor(bat.level*100)+"%","");
            resolve(batChgId,bat.charging);
            resolve(batChgTId,bat.chargingTime===Infinity?"N/A":bat.chargingTime+"s","");
            resolve(batDisId,bat.dischargingTime===Infinity?"N/A":bat.dischargingTime+"s","");
        }).catch(()=>{[batLvlId,batChgId,batChgTId,batDisId].forEach(id=>resolve(id,"Unavailable","f"));});
    }else{[batLvlId,batChgId,batChgTId,batDisId].forEach(id=>resolve(id,"Unavailable","f"));}
    section("Network Request Probes");
    const netProbes = [
        ["Cloudflare Trace","https://1.1.1.1/cdn-cgi/trace"],
        ["Cloudflare DNS (DoH)","https://cloudflare-dns.com/dns-query?name=kaeui.com"],
        ["Google DNS (DoH)","https://dns.google/resolve?name=kaeui.com"],
        ["Cloudflare CDN (cdnjs)","https://cdnjs.cloudflare.com/ajax/libs/purplecoat/1.0.0/purplecoat.min.js"],
        ["Google CDN","https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"],
        ["jsDelivr","https://cdn.jsdelivr.net/npm/vue@3.4.0/dist/vue.global.prod.js"],
        ["unpkg","https://unpkg.com/react@18.2.0/umd/react.production.min.js"],
        ["Microsoft Azure CDN","https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.7.1.min.js"],
        ["BunnyCDN","https://bunny.net/favicon.ico"],
        ["Firebase (gstatic)","https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"],
        ["Supabase CDN","https://cdn.supabase.com/js/v2/index.js"],
        ["AWS CloudFront","https://d1.awsstatic.com/marketplace/sc-logo-sm.png"],
        ["Cloudinary","https://res.cloudinary.com/demo/image/upload/sample.jpg"],
        ["Google Analytics","https://www.google-analytics.com/analytics.js"],
        ["Google Tag Manager","https://www.googletagmanager.com/gtm.js?id=GTM-123456"],
        ["Mixpanel","https://cdn.mxpnl.com/libs/mixpanel-2-latest.min.js"],
        ["Amplitude","https://cdn.amplitude.com/libs/amplitude-8.21.4-min.gz.js"],
        ["Stripe JS","https://js.stripe.com/v3/"],
        ["Sentry","https://browser.sentry-cdn.com/7.93.0/bundle.min.js"],
        ["Intercom","https://widget.intercom.io/widget/123456"]
    ];
    const netIds=netProbes.map(([name])=>probeRow(name));
    netProbes.forEach(([,url],i)=>{
        probeURL(url).then(r=>resolve(netIds[i],r,r==="Reachable"?"t":r==="Timeout"?"w":"f"));
    });
    section("Ad Blocker Detection");
    const adResults=[];
    const domId=probeRow("DOM Element Hiding");
    const el=document.createElement("div");
    el.setAttribute("class","ad ads adsbox ad-placement carbon-ad adsense adsbygoogle");
    el.setAttribute("id","ad-banner");
    el.style.cssText="position:absolute;top:-9999px;left:-9999px;width:10px;height:10px;";
    document.body.appendChild(el);
    await new Promise(r=>setTimeout(r,200));
    const domHid=el.offsetHeight===0||el.offsetParent===null||getComputedStyle(el).display==="none"||getComputedStyle(el).visibility==="hidden"||getComputedStyle(el).opacity==="0";
    document.body.removeChild(el);
    resolve(domId,domHid?"Blocked":"Passed",domHid?"f":"t");
    adResults.push(domHid);
    const baitNames=["ad-container","adzone","sponsored-banner","banner-ad","rectangle-ad","dfp-ad-slot","gpt-ad","ad-unit","leaderboard-ad","sticky-ad"];
    const baitIds=baitNames.map(bid=>probeRow("Bait #"+bid));
    for(let i=0;i<baitNames.length;i++){
        const be=document.createElement("div");
        be.id=baitNames[i];be.className="adsbox ad";
        be.style.cssText="position:absolute;top:-9999px;width:1px;height:1px;";
        document.body.appendChild(be);
        await new Promise(r=>setTimeout(r,40));
        const bh=be.offsetHeight===0;
        document.body.removeChild(be);
        resolve(baitIds[i],bh?"Blocked":"Passed",bh?"f":"t");
        adResults.push(bh);
    }
    const adFetchList = [
        {url:"https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js",name:"Google AdSense"},
        {url:"https://securepubads.g.doubleclick.net/tag/js/gpt.js",name:"DoubleClick GPT"},
        {url:"https://www.googletagservices.com/tag/js/gpt.js",name:"Google Tag Services"},
        {url:"https://pagead2.googlesyndication.com/pagead/css/adblock.css",name:"AdSense CSS"},
        {url:"https://connect.facebook.net/en_US/fbevents.js",name:"Facebook Pixel"},
        {url:"https://static.ads-twitter.com/uwt.js",name:"X (Twitter) Ads"},
        {url:"https://analytics.tiktok.com/i18n/pixel/sdk.js",name:"TikTok Pixel"},
        {url:"https://snap.licdn.com/li.lms-analytics/insight.min.js",name:"LinkedIn Insight"},
        {url:"https://cdn.taboola.com/libtrc/unip/loader.js",name:"Taboola"},
        {url:"https://widgets.outbrain.com/outbrain.js",name:"Outbrain"},
        {url:"https://static.criteo.net/js/ld/ld.js",name:"Criteo"},
        {url:"https://s.amazon-adsystem.com/aax2/apstag.js",name:"Amazon Ads"},
        {url:"https://z.moatads.com/moatad.js",name:"Moat Ads"},
        {url:"https://pixel.advertising.com/favicon.ico",name:"Advertising.com"}
    ];
    const adFetchIds=adFetchList.map(({name})=>probeRow(name));
    const adFetchPromises=adFetchList.map(async({url},i)=>{
        let blocked=false;
        try{
            const ctrl=new AbortController();
            const t=setTimeout(()=>ctrl.abort(),4000);
            await fetch(url,{method:"HEAD",mode:"no-cors",signal:ctrl.signal,cache:"no-store"});
            clearTimeout(t);
        }catch(e){blocked=true;}
        resolve(adFetchIds[i],blocked?"Blocked":"Passed",blocked?"f":"t");
        adResults.push(blocked);
        return blocked;
    });
    const scriptId=probeRow("Script Inject (AdSense)");
    const scriptProm=new Promise(res=>{
        const s=document.createElement("script");
        s.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?_t="+Date.now();
        s.onload=()=>res(false);s.onerror=()=>res(true);
        document.head.appendChild(s);
        setTimeout(()=>res(true),4000);
    });
    const imgTests=[
        {src:"https://ad.doubleclick.net/favicon.ico",name:"DoubleClick Pixel"},
        {src:"https://googleads.g.doubleclick.net/pagead/viewthroughconversion/favicon.ico",name:"Google Ads Pixel"},
        {src:"https://www.google-analytics.com/collect?v=1&t=event&tid=UA-00000-1&cid=1",name:"GA Collect Pixel"},
        {src:"https://www.facebook.com/tr?id=1&ev=PageView",name:"Facebook Track Pixel"},
    ];
    const imgIds=imgTests.map(({name})=>probeRow(name));
    const imgPromises=imgTests.map(({src},i)=>new Promise(res=>{
        const img=new Image();
        const finish=(bl)=>{resolve(imgIds[i],bl?"Blocked":"Passed",bl?"f":"t");adResults.push(bl);res(bl);};
        img.onload=()=>finish(false);img.onerror=()=>finish(true);
        img.src=src+(src.includes("?")?"&":"?")+"_t="+Date.now();
        setTimeout(()=>finish(true),3000);
    }));
    const globalId=probeRow("adsbygoogle global");
    const verdictId=probeRow("Ad Blocker Verdict");
    const scoreId=probeRow("Ad Blocker Score");
    await Promise.all([
        ...adFetchPromises,...imgPromises,
        scriptProm.then(blocked=>{
            resolve(scriptId,blocked?"Blocked":"Passed",blocked?"f":"t");
            adResults.push(blocked);
        })
    ]);
    const gMissing=typeof window.adsbygoogle==="undefined";
    resolve(globalId,gMissing?"Blocked":"Passed",gMissing?"f":"t");
    adResults.push(gMissing);
    const blocked=adResults.filter(Boolean).length;
    const total=adResults.length;
    const score=Math.round((blocked/total)*100);
    resolve(scoreId,blocked+"/"+total+" ("+score+"%)","");
    let vtext,vcls;
    if(score>=60){vtext="ACTIVE";vcls="f";}
    else if(score>=30){vtext="Partial / DNS-level";vcls="w";}
    else{vtext="Not detected";vcls="t";}
    setTimeout(()=>resolve(verdictId,vtext,vcls,true),80);
    section("Permissions");
    const permNames=["geolocation","notifications","clipboard-read","clipboard-write","persistent-storage","midi","accelerometer","gyroscope","magnetometer","camera","microphone","ambient-light-sensor","background-sync","screen-wake-lock","storage-access","window-management","local-fonts","display-capture"];
    const permIds=permNames.map(p=>probeRow(p));
    permNames.forEach((p,i)=>{
        navigator.permissions.query({name:p}).then(r=>resolve(permIds[i],r.state)).catch(()=>resolve(permIds[i],"Unavailable","w"));
    });
    section("Sensor Access");
    const doId=probeRow("DeviceOrientation");
    const dmId=probeRow("DeviceMotion");
    if(window.DeviceOrientationEvent){
        try{const rp=DeviceOrientationEvent.requestPermission;if(typeof rp==="function") rp().then(s=>resolve(doId,s)).catch(()=>resolve(doId,"Denied","f"));else resolve(doId,"Available (no prompt)","t");}catch(e){resolve(doId,"Unavailable","f");}
    }else resolve(doId,"Unavailable","f");
    if(window.DeviceMotionEvent){
        try{const rp=DeviceMotionEvent.requestPermission;if(typeof rp==="function") rp().then(s=>resolve(dmId,s)).catch(()=>resolve(dmId,"Denied","f"));else resolve(dmId,"Available (no prompt)","t");}catch(e){resolve(dmId,"Unavailable","f");}
    }else resolve(dmId,"Unavailable","f");
    const sensorList=[["Accelerometer",window.Accelerometer],["Gyroscope",window.Gyroscope],["AmbientLightSensor",window.AmbientLightSensor],["Magnetometer",window.Magnetometer],["LinearAccelerationSensor",window.LinearAccelerationSensor],["GravitySensor",window.GravitySensor],["AbsoluteOrientationSensor",window.AbsoluteOrientationSensor],["RelativeOrientationSensor",window.RelativeOrientationSensor]];
    for(const [name,Cls] of sensorList){
        if(Cls){try{new Cls();row(name,"Available","t");}catch(e){row(name,e.name||"Error","f");}}
    }
    section("Media & Peripheral Access");
    const camId=probeRow("Camera / Microphone");
    navigator.mediaDevices.getUserMedia({video:true,audio:true})
        .then(stream=>{resolve(camId,"Granted","t");stream.getTracks().forEach(t=>{subrow("Track",t.kind+" - "+t.label,"");t.stop();});})
        .catch(err=>resolve(camId,err.message,"f"));
    const midiId=probeRow("MIDI Access");
    if(navigator.requestMIDIAccess){
        navigator.requestMIDIAccess().then(midi=>resolve(midiId,"Inputs:"+midi.inputs.size+" Outputs:"+midi.outputs.size,"")).catch(()=>resolve(midiId,"Denied","f"));
    }else resolve(midiId,"Unavailable","f");
    const vrId=probeRow("VR (immersive-vr)");
    const arId=probeRow("AR (immersive-ar)");
    if(navigator.xr){
        navigator.xr.isSessionSupported("immersive-vr").then(v=>resolve(vrId,v)).catch(()=>resolve(vrId,"Unavailable","f"));
        navigator.xr.isSessionSupported("immersive-ar").then(v=>resolve(arId,v)).catch(()=>resolve(arId,"Unavailable","f"));
    }else{resolve(vrId,"Unavailable","f");resolve(arId,"Unavailable","f");}
    const notifId=probeRow("Notification Permission");
    Notification.requestPermission().then(p=>resolve(notifId,p)).catch(()=>resolve(notifId,"Unavailable","f"));
    const clipId=probeRow("Clipboard Read");
    navigator.clipboard.readText().then(t=>resolve(clipId,t?"Has content":"Empty","")).catch(e=>resolve(clipId,e.message,"w"));
    section("Geolocation");
    const gpsId=probeRow("GPS Coordinates");
    const gpsAltId=probeRow("GPS Altitude");
    const gpsSpdId=probeRow("GPS Speed");
    const gpsHdgId=probeRow("GPS Heading");
    navigator.geolocation.getCurrentPosition(
        pos=>{
            resolve(gpsId,pos.coords.latitude.toFixed(6)+", "+pos.coords.longitude.toFixed(6)+" (±"+Math.round(pos.coords.accuracy)+"m)","");
            resolve(gpsAltId,pos.coords.altitude!==null?Math.round(pos.coords.altitude)+"m":"N/A","");
            resolve(gpsSpdId,pos.coords.speed!==null?pos.coords.speed.toFixed(1)+" m/s":"N/A","");
            resolve(gpsHdgId,pos.coords.heading!==null?pos.coords.heading.toFixed(1)+"°":"N/A","");
        },
        err=>{resolve(gpsId,err.message,"f");[gpsAltId,gpsSpdId,gpsHdgId].forEach(id=>resolve(id,"N/A",""));}
    );
}
run();
</script>
</body>
</html>
